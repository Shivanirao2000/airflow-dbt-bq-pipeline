version: 2

models:

  - name: stg_yellow_trips
    description: >
      Cleaned and standardised Yellow Taxi trips for January 2023.
      Columns are renamed to snake_case, timestamps are cast, invalid trips
      (zero/negative distance, zero/negative fare, impossible durations) are
      filtered out, and trip_duration_minutes is derived from the pickup and
      dropoff timestamps.
    columns:

      # --- Identifiers ---
      - name: vendor_id
        description: "TPEP provider (1=Creative Mobile Technologies, 2=VeriFone)."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2]
              quote: false

      - name: pickup_location_id
        description: "TLC Taxi Zone ID where the meter was engaged."
        tests:
          - not_null

      - name: dropoff_location_id
        description: "TLC Taxi Zone ID where the meter was disengaged."
        tests:
          - not_null

      - name: rate_code_id
        description: >
          Final rate code in effect at trip end.
          1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group ride.

      - name: payment_type
        description: "Payment method (1=Credit card, 2=Cash, 3=No charge, 4=Dispute)."
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4]
              quote: false

      # --- Timestamps ---
      - name: pickup_datetime
        description: "Timestamp when the meter was engaged. Cast from tpep_pickup_datetime."
        tests:
          - not_null

      - name: dropoff_datetime
        description: "Timestamp when the meter was disengaged. Cast from tpep_dropoff_datetime."
        tests:
          - not_null

      # --- Trip details ---
      - name: passenger_count
        description: "Number of passengers in the vehicle (driver-entered)."

      - name: trip_distance
        description: "Elapsed trip distance in miles reported by the taximeter. Always > 0 after filtering."
        tests:
          - not_null

      - name: store_and_fwd_flag
        description: "Y if the trip record was held in vehicle memory before sending to vendor; N otherwise."

      - name: trip_duration_minutes
        description: >
          Derived. Integer minutes between pickup_datetime and dropoff_datetime.
          Rows with duration <= 0 or >= 1440 minutes are filtered out upstream.
        tests:
          - not_null

      # --- Fares ---
      - name: fare_amount
        description: "Time-and-distance fare calculated by the meter. Always > 0 after filtering."
        tests:
          - not_null

      - name: extra
        description: "Miscellaneous extras and surcharges (e.g. $0.50 rush-hour, $1 overnight)."

      - name: mta_tax
        description: "$0.50 MTA tax automatically triggered based on the metered rate in use."

      - name: tip_amount
        description: "Tip amount. Automatically populated for credit card payments; cash tips are not included."

      - name: tolls_amount
        description: "Total amount of all tolls paid during the trip."

      - name: improvement_surcharge
        description: "$0.30 improvement surcharge assessed at the flag drop on hailed trips."

      - name: congestion_surcharge
        description: "Congestion surcharge for trips that pick up in the Manhattan congestion zone."

      - name: airport_fee
        description: "$1.25 pickup fee for trips originating at LaGuardia or JFK airports."

      - name: total_amount
        description: "Total amount charged to passengers, excluding cash tips."
        tests:
          - not_null
