version: 2

sources:

  - name: nyc_taxi_raw
    description: "Raw NYC Taxi trip data loaded by the Airflow ingest pipeline."
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: nyc_taxi_raw
    tables:
      - name: yellow_trips_raw
        description: >
          Raw Yellow Taxi trip records for January 2023, loaded unmodified from the
          TLC public dataset. One row per completed trip.
        columns:
          - name: VendorID
            description: "TPEP provider that generated the record (1=Creative Mobile, 2=VeriFone)."
          - name: tpep_pickup_datetime
            description: "Date and time the meter was engaged."
          - name: tpep_dropoff_datetime
            description: "Date and time the meter was disengaged."
          - name: passenger_count
            description: "Number of passengers (driver-entered value)."
          - name: trip_distance
            description: "Elapsed trip distance in miles."
          - name: RatecodeID
            description: "Final rate code in effect at the end of the trip."
          - name: store_and_fwd_flag
            description: "Whether the trip record was held in vehicle memory (Y/N)."
          - name: PULocationID
            description: "TLC Taxi Zone where the meter was engaged."
          - name: DOLocationID
            description: "TLC Taxi Zone where the meter was disengaged."
          - name: payment_type
            description: "How the passenger paid (1=Credit card, 2=Cash, 3=No charge, 4=Dispute)."
          - name: fare_amount
            description: "Time-and-distance fare calculated by the meter."
          - name: extra
            description: "Miscellaneous extras and surcharges."
          - name: mta_tax
            description: "MTA tax automatically triggered based on metered rate."
          - name: tip_amount
            description: "Tip amount (automatically populated for credit card tips)."
          - name: tolls_amount
            description: "Total amount of all tolls paid."
          - name: improvement_surcharge
            description: "Improvement surcharge assessed on hailed trips at the flag drop."
          - name: congestion_surcharge
            description: "Congestion surcharge for trips in the congestion zone."
          - name: airport_fee
            description: "Airport pickup fee for trips originating at JFK or LaGuardia."
          - name: total_amount
            description: "Total amount charged to passengers (excludes cash tips)."